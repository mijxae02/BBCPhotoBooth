<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BernTheBeansPhotoBooth</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="photobooth">
    <div>
        <h1 class="logo2">
            BearnTheBeansCafe
        </h1>
    </div>

    <div id="setup-screen" class="setup-container">
        <h2>Choose your settings</h2>

        <div class="option-group">
            <label>Camera</label>
            <div class="option-buttons">
                <button class="option-btn active" data-camera="user">Front Camera</button>
                <button class="option-btn" data-camera="environment">Back Camera</button>
            </div>
        </div>

        <div class="option-group">
            <label>Photo Size</label>
            <div class="option-buttons">
                <button class="option-btn active" data-size="portrait">Portrait (480x640)</button>
                <button class="option-btn" data-size="square">Square (600x600)</button>
                <button class="option-btn" data-size="landscape">Landscape (640x480)</button>
            </div>
        </div>

        <button id="start-btn">Start Photobooth</button>
    </div>

    <div class="camera-container" style="display:none;">
        <div id="countdown">Taking photo in...</div>
        <video id="video" autoplay></video>
        <div id="counter">0/4</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
