<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bern The Beans PhotoBooth</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500..700&family=Caveat:wght@500;700&family=Kreon:wght@300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="download">

    <div>
        <h1 class="logo2">Bern The Beans</h1>
    </div>

    <div class="main-container">
        <canvas id="finalCanvas"></canvas>

        <div class="right">
            <h2>Choose your frame</h2>
            <p class="receipt-note">one shot, freshly poured</p>

            <div class="color-grid">
                <button class="color-btn" data-color="img/nude.jpg" style="background-image: url('img/nude.jpg');"></button>
                <button class="color-btn" data-color="img/lilac.jpg" style="background-image: url('img/lilac.jpg');"></button>
                <button class="color-btn" data-color="img/blue.jpg" style="background-image: url('img/blue.jpg');"></button>
                <button class="color-btn" data-color="img/red.jpg" style="background-image: url('img/red.jpg');"></button>
                <button class="color-btn" data-color="img/cobalt.jpg" style="background-image: url('img/cobalt.jpg');"></button>
                <button class="color-btn" data-color="img/matcha.jpg" style="background-image: url('img/matcha.jpg');"></button>
                <button class="color-btn" data-color="img/valentines.png" style="background-image: url('img/valentines.png');"></button>
                <button class="color-btn" data-color="img/valentines1.png" style="background-image: url('img/valentines1.png');"></button>
                <button class="color-btn" data-color="img/valentines2.png" style="background-image: url('img/valentines2.png');"></button>
                <button class="color-btn" data-color="img/yellow.jpg" style="background-image: url('img/yellow.jpg');"></button>
                <button class="color-btn" data-color="img/black.jpg" style="background-image: url('img/black.jpg');"></button>
                <button class="color-btn" data-color="img/purple.jpg" style="background-image: url('img/purple.jpg');"></button>
                <button class="color-btn" data-color="img/green.jpg" style="background-image: url('img/green.jpg');"></button>
                <button class="color-btn" data-color="img/bgg.jpg" style="background-image: url('img/bgg.jpg');"></button>
                <button class="color-btn" data-color="img/1.png" style="background-image: url('img/1.png');"></button>
                <button class="color-btn" data-color="img/2.png" style="background-image: url('img/2.png');"></button>
                <button class="color-btn" data-color="img/3.png" style="background-image: url('img/3.png');"></button>
                <button class="color-btn" data-color="img/4.png" style="background-image: url('img/4.png');"></button>
                <button class="color-btn" data-color="img/5.png" style="background-image: url('img/5.png');"></button>
                <button class="color-btn" data-color="img/6.png" style="background-image: url('img/6.png');"></button>
                <button class="color-btn" data-color="img/7.png" style="background-image: url('img/7.png');"></button>
            </div>

            <div class="button-last">
                <a href="photobooth.html"><button>Retake</button></a>
                <button id="download-btn">Download</button>
            </div>
        </div>
    </div>

    <script src="download.js"></script>

</body>
</html>
